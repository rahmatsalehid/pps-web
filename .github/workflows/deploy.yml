name: Deploy PPS Web

on:
  push:
    branches:
      - production

jobs:
  deploy:
    name: Deploy PPS Web
    runs-on: self-hosted

    steps:
      - name: Checkout production
        uses: actions/checkout@v4

      - name: Deploy Docker
        shell: bash
        run: |
          set -e

          echo "=== Deploy PPS Web ==="

          cd /home/api/pps_web

          echo "=== Copy source ==="

          rsync -av --delete \
            --exclude='.env' \
            --exclude='.env.local' \
            --exclude='.git/' \
            --exclude='.next/' \
            --exclude='node_modules/' \
            --exclude='*.tsbuildinfo' \
            "$GITHUB_WORKSPACE/" \
            /home/api/pps_web/

          echo "=== Check production environment ==="

          if [ ! -f /home/api/pps_web/.env ]; then
            echo "ERROR: /home/api/pps_web/.env tidak ditemukan!"
            exit 1
          fi

          echo "=== Build Docker ==="

          docker compose build

          echo "=== Start PPS Web ==="

          docker compose up -d

          echo "=== Cleanup old images ==="

          docker image prune -f

          echo "=== Container status ==="

          docker ps --filter "name=pps-web"

          echo "=== Deployment completed ==="